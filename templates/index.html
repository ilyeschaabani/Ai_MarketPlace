<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Used Car Price Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
    <h1 class="text-2xl font-bold mb-4 text-center">🚗 Used Car Price Predictor</h1>
    <form method="POST" action="/predict" class="space-y-3">

      <div>
        <label class="block font-medium">Make</label>
        <input name="make" type="text" required class="w-full p-2 border rounded-lg">
      </div>

      <div>
        <label class="block font-medium">Model</label>
        <input name="model" type="text" required class="w-full p-2 border rounded-lg">
      </div>

      <div>
        <label class="block font-medium">Year</label>
        <input name="year" type="number" min="1990" max="2025" required class="w-full p-2 border rounded-lg">
      </div>

      <div>
        <label class="block font-medium">Mileage (km)</label>
        <input name="mileage" type="number" required class="w-full p-2 border rounded-lg">
      </div>

      <div>
        <label class="block font-medium">Seller Type</label>
        <select name="seller" class="w-full p-2 border rounded-lg">
          <option value="dealer">Dealer</option>
          <option value="private">Private</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700">
        Predict Price
      </button>

    </form>

    {% if prediction_text %}
      <div class="mt-4 text-center text-lg font-semibold text-green-600">
        {{ prediction_text }}
      </div>
    {% endif %}
  </div>

</body>
</html>
